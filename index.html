<style>
/* Layout: phone-shaped app column, sticky top bar, bottom tab bar, sheets slide up for products and creator profiles */
:root{
  --bg:#eef0f7; --surface:#ffffff; --sunk:#e3e6f1; --fg:#161a2e; --muted:#5d6380; --line:#d5d9e8;
  --accent:#2f4bff; --accent-fg:#ffffff; --pop:#ff8a5c; --like:#ff3d6e; --ok:#1a9b63;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1120; --surface:#181b2e; --sunk:#22263d; --fg:#eceefa; --muted:#9aa0c0; --line:#2c3150;
  --accent:#7d8cff; --accent-fg:#0f1120; --pop:#ff9d76; --like:#ff6b8e; --ok:#3fd193; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1120; --surface:#181b2e; --sunk:#22263d; --fg:#eceefa; --muted:#9aa0c0; --line:#2c3150;
  --accent:#7d8cff; --accent-fg:#0f1120; --pop:#ff9d76; --like:#ff6b8e; --ok:#3fd193; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:760px;margin:0 auto;min-height:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.logo{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo .ring{width:22px;height:22px;border-radius:50%;border:5px solid var(--accent);box-shadow:6px 0 0 -1px var(--pop)}
.top .spacer{flex:1}
.pill{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--sunk);padding:4px 10px;border-radius:99px}
.cartbtn{border:0;background:var(--sunk);border-radius:99px;padding:8px 14px;font-weight:600}
.cartbtn b{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:99px;background:var(--accent);color:var(--accent-fg);font-size:12px;margin-left:6px;padding:0 5px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs button{border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

main section{padding-block:16px}
h2{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0;text-wrap:balance}
h3.sec{font-family:var(--display);font-size:20px;margin:24px 0 8px}
.sub{color:var(--muted);margin:4px 0 0}

.av{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none;display:block;background:var(--sunk)}
.av.sm{width:38px;height:38px}
.av.xs{width:24px;height:24px}
.av.lg{width:84px;height:84px}

.stories{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.story{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);border:0;background:none;width:68px;padding:0}
.story .ringwrap{padding:3px;border-radius:50%;background:conic-gradient(var(--accent),var(--pop),var(--accent))}
.story .ringwrap img{width:56px;height:56px;border:3px solid var(--bg)}
.story span.n{max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.topics{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:14px;padding-bottom:2px}
.topics .chip{flex:none}

.composer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;margin-top:12px}
.composer .row{display:flex;gap:10px;align-items:flex-start}
.composer textarea{flex:1;min-width:0;border:0;background:var(--sunk);border-radius:10px;padding:10px 12px;resize:vertical;min-height:64px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip select{border:0;background:transparent;max-width:150px}
.btn{border:0;background:var(--accent);color:var(--accent-fg);font-weight:700;border-radius:99px;padding:9px 18px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--sunk);color:var(--fg)}
.btn.sm{padding:6px 14px;font-size:13px}
.preview-img{max-height:180px;border-radius:10px}
.tools .grow{flex:1}
.hint{font-size:12px;color:var(--muted)}

.feed{display:grid;gap:14px;margin-top:14px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.post .head{display:flex;gap:10px;align-items:center;padding:12px 14px}
.post .head .who{min-width:0;flex:1;border:0;background:none;text-align:left;padding:0;display:flex;gap:10px;align-items:center}
.post .head .name{font-weight:700}
.post .head .meta{color:var(--muted);font-size:13px}
.post .text{padding:0 14px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.media{position:relative;background:var(--sunk);aspect-ratio:4/5;width:100%;max-width:100%;overflow:hidden}
.media.square{aspect-ratio:1/1}
.media img,.media canvas{width:100%;height:100%;object-fit:cover;display:block}
.media .play{position:absolute;inset:0;margin:auto;width:68px;height:68px;border-radius:50%;border:0;background:rgba(10,12,30,.55);display:grid;place-items:center;color:#fff}
.media .play svg{width:30px;height:30px}
.media .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--pop);width:0}
.media .tag{position:absolute;left:12px;top:12px;background:rgba(10,12,30,.6);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;letter-spacing:.03em}
.media .views{position:absolute;right:12px;top:12px;background:rgba(10,12,30,.6);color:#fff;font-size:12px;padding:4px 10px;border-radius:99px;font-variant-numeric:tabular-nums}
.post .actions{display:flex;gap:4px;padding:6px 8px;align-items:center}
.act{border:0;background:none;display:inline-flex;align-items:center;gap:6px;padding:8px;border-radius:10px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.act svg{width:22px;height:22px}
.act.on{color:var(--like)}
.act.on svg path{fill:var(--like)}
.act:hover{background:var(--sunk)}
.del{margin-left:auto}
.shoplink{margin:0 14px 12px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--bg);width:calc(100% - 28px);text-align:left}
.shoplink img{width:48px;height:48px;border-radius:9px;object-fit:cover}
.shoplink .t{flex:1;min-width:0}
.shoplink .t div:first-child{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shoplink .t div:last-child{color:var(--muted);font-size:13px}
.comments{border-top:1px solid var(--line);padding:10px 14px;display:grid;gap:8px;font-size:14px}
.comments p{margin:0;overflow-wrap:anywhere;display:flex;gap:8px;align-items:flex-start}
.comments p span{min-width:0}
.comments form{display:flex;gap:8px;margin-top:2px}
.comments input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:7px 12px}

.shopbar{display:grid;gap:10px;margin-top:12px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:8px 14px}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none}
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.cats .chip{flex:none}
.sortrow{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.sortrow select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
@media (min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0}
.pimg{position:relative;aspect-ratio:1/1;width:100%;background:var(--sunk)}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pimg .badge{position:absolute;left:8px;top:8px;background:var(--fg);color:var(--bg);font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;letter-spacing:.03em;text-transform:uppercase}
.card .info{padding:10px 12px 12px;display:grid;gap:3px;flex:1}
.card .nm{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.card .sl{color:var(--muted);font-size:12px}
.card .pr{display:flex;align-items:baseline;gap:6px;margin-top:auto;padding-top:4px;font-variant-numeric:tabular-nums}
.card .pr b{font-size:17px}
.card .pr s{color:var(--muted);font-size:12px}
.stars{color:var(--pop);font-size:12px;letter-spacing:1px}
.stars small{color:var(--muted);letter-spacing:0;margin-left:4px}
.empty{color:var(--muted);text-align:center;padding:40px 10px}

.scrim{position:fixed;inset:0;background:rgba(8,10,25,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{position:relative;background:var(--surface);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:20px 20px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:620px){.scrim{align-items:center}.sheet{border-radius:20px}}
.sheet .pimg{aspect-ratio:16/12}
.sheet .body{padding:16px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px}
.sheet h3{font-family:var(--display);font-size:24px;margin:0;line-height:1.15;text-wrap:balance}
.sheet .price{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px}
.qty button{border:0;background:none;width:36px;height:36px;font-size:18px}
.qty span{min-width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.sheet .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.close{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;border:0;background:var(--surface);color:var(--fg);font-size:20px;line-height:1;z-index:2}
.specs{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.specs dt{color:var(--muted)}
.specs dd{margin:0}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.thumbs button{border:0;padding:0;aspect-ratio:4/5;background:var(--sunk);position:relative;overflow:hidden}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .ic{position:absolute;right:6px;top:6px;color:#fff;width:18px;height:18px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.thumbs .txt{display:grid;place-items:center;padding:8px;font-size:12px;height:100%;text-align:center;color:var(--fg)}

.cartlist{display:grid;gap:10px;margin-top:14px}
.line{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;flex-wrap:wrap}
.line img{width:64px;height:64px;border-radius:10px;flex:none}
.line .t{flex:1;min-width:120px}
.line .t div:first-child{font-weight:600}
.line .money{font-weight:700;font-variant-numeric:tabular-nums}
.totals{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:14px;display:grid;gap:6px;font-variant-numeric:tabular-nums}
.totals .r{display:flex;justify-content:space-between}
.totals .big{font-size:20px;font-weight:800;border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}
.coins{font-weight:700;color:var(--pop)}

.prof{display:flex;gap:16px;align-items:center;margin-top:8px}
.stats{display:flex;gap:18px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.stats div{display:grid;font-size:13px;color:var(--muted)}
.stats b{font-size:18px;color:var(--fg)}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.field input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-weight:400;color:var(--fg)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw[aria-pressed="true"]{border:3px solid var(--fg)}
.editor{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px;margin-top:16px}
.editor .lbl{font-size:13px;color:var(--muted);font-weight:600}
.orders{display:grid;gap:8px}
.order{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.status{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:99px;background:var(--sunk);color:var(--ok)}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;z-index:60;max-width:calc(100% - 32px);text-align:center}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<style>
/* Cozy pass: warm peach paper with a dot pattern, candy pink accent, honey + mint helpers, puffy rounded shapes, floating pill nav */
:root{
  --bg:#fff4ee; --dot:#ffe0d3; --surface:#ffffff; --sunk:#ffede6; --fg:#4b2e3b; --muted:#9b7484; --line:#f7ddd3;
  --accent:#ff6f91; --accent-deep:#e14f74; --accent-fg:#ffffff; --pop:#ffae42; --like:#ff4f7b; --ok:#2fb383;
  --mint:#c8f1e2; --honey:#fff0c2; --shadow:rgba(214,120,130,.16);
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif; --r:24px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#2b1f2c; --dot:#35273a; --surface:#3a2a3e; --sunk:#47344b; --fg:#ffeef3; --muted:#cfaebc; --line:#503b54;
  --accent:#ff8fab; --accent-deep:#d9668a; --accent-fg:#2b1f2c; --pop:#ffc46b; --like:#ff7d9c; --ok:#5fd6a8;
  --mint:#2f4a42; --honey:#4d3f2a; --shadow:rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2b1f2c; --dot:#35273a; --surface:#3a2a3e; --sunk:#47344b; --fg:#ffeef3; --muted:#cfaebc; --line:#503b54;
  --accent:#ff8fab; --accent-deep:#d9668a; --accent-fg:#2b1f2c; --pop:#ffc46b; --like:#ff7d9c; --ok:#5fd6a8;
  --mint:#2f4a42; --honey:#4d3f2a; --shadow:rgba(0,0,0,.35); color-scheme:dark}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.6px,transparent 2px);background-size:22px 22px;font-weight:600}
h2,h3,.logo,.sheet h3{font-family:var(--display);font-weight:700;letter-spacing:0}
.app{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
header.top{background:var(--surface);border-bottom:0;box-shadow:0 4px 18px var(--shadow);border-radius:0 0 26px 26px}
.logo{font-size:26px;color:var(--accent)}
.logo .ring{width:30px;height:30px;border:0;border-radius:50%;background:var(--accent);box-shadow:inset -5px -6px 0 var(--accent-deep);position:relative}
.logo .ring::after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:var(--surface);left:7px;top:7px}
.cartbtn{background:var(--honey);color:var(--fg)}
nav.tabs{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;border:0;border-radius:30px;padding-bottom:0;box-shadow:0 8px 28px var(--shadow)}
nav.tabs .in{padding:6px}
nav.tabs button{border-radius:22px;padding:8px 4px}
nav.tabs button[aria-current="page"]{background:var(--sunk);color:var(--accent)}
.hello{background:linear-gradient(120deg,var(--honey),var(--mint));border-radius:var(--r);padding:16px 18px;margin-bottom:14px;display:flex;align-items:center;gap:14px}
.hello h2{font-size:24px}
.hello .sub{color:var(--fg);opacity:.75}
.story{color:var(--fg)}
.story .ringwrap{background:conic-gradient(var(--accent),var(--pop),#7fd8be,var(--accent))}
.composer,.post,.card,.line,.totals,.editor,.order{border:0;box-shadow:0 6px 20px var(--shadow);border-radius:var(--r)}
.composer textarea{border-radius:18px}
.chip{border:0;background:var(--surface);box-shadow:0 2px 8px var(--shadow);font-weight:700}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.btn{box-shadow:0 4px 0 var(--accent-deep);font-weight:800;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-deep)}
.btn.ghost{background:var(--sunk);box-shadow:0 4px 0 var(--line)}
.media{border-radius:20px;width:calc(100% - 20px);margin:0 10px}
.media .tag,.media .views{background:rgba(255,255,255,.85);color:#4b2e3b}
.media .play{background:rgba(255,111,145,.9);width:74px;height:74px;box-shadow:0 6px 0 rgba(225,79,116,.9)}
.media .bar{background:#fff;height:5px}
.act.on svg path{fill:var(--like)}
.shoplink{border:0;background:var(--honey);border-radius:18px}
.comments{border-top:2px dotted var(--line)}
.comments input,.search{border:0;box-shadow:0 2px 10px var(--shadow)}
.search{background:var(--surface)}
.pimg{background:var(--sunk)}
.pimg .badge{background:var(--accent);color:var(--accent-fg)}
.card .pr b{color:var(--accent-deep)}
.stars{color:var(--pop)}
.sheet{border-radius:30px 30px 0 0}
@media (min-width:620px){.sheet{border-radius:30px}}
.sheet .pimg{border-radius:0 0 26px 26px;overflow:hidden}
.close{box-shadow:0 2px 10px var(--shadow)}
.thumbs button{border-radius:14px}

<script>
/* ================= DRAWING LIBRARY (people, scenes, products) ================= */
var LM=(function(){
const TAU=Math.PI*2;
function rr(x,X,Y,W,H,r){r=Math.max(0,Math.min(r,W/2,H/2));x.moveTo(X+r,Y);x.arcTo(X+W,Y,X+W,Y+H,r);x.arcTo(X+W,Y+H,X,Y+H,r);x.arcTo(X,Y+H,X,Y,r);x.arcTo(X,Y,X+W,Y,r);x.closePath()}
function G(x){return{
  R(X,Y,W,H,r,f){x.beginPath();rr(x,X,Y,W,H,r);x.fillStyle=f;x.fill()},
  SR(X,Y,W,H,r,s,lw){x.beginPath();rr(x,X,Y,W,H,r);x.strokeStyle=s;x.lineWidth=lw;x.stroke()},
  C(X,Y,r,f){x.beginPath();x.arc(X,Y,Math.max(0,r),0,TAU);x.fillStyle=f;x.fill()},
  E(X,Y,rx,ry,f,rot){x.beginPath();x.ellipse(X,Y,Math.max(0,rx),Math.max(0,ry),rot||0,0,TAU);x.fillStyle=f;x.fill()},
  P(p,f){x.beginPath();x.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)x.lineTo(p[i],p[i+1]);x.closePath();x.fillStyle=f;x.fill()},
  L(a,b,c,d,s,w){x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.strokeStyle=s;x.lineWidth=w;x.lineCap="round";x.stroke()},
  A(X,Y,r,a0,a1,s,w){x.beginPath();x.arc(X,Y,r,a0,a1);x.strokeStyle=s;x.lineWidth=w;x.lineCap="round";x.stroke()},
  T(t,X,Y,f,font,al){x.fillStyle=f;x.font=font;x.textAlign=al||"center";x.textBaseline="middle";x.fillText(t,X,Y)},
  lin(x0,y0,x1,y1,stops){const g=x.createLinearGradient(x0,y0,x1,y1);stops.forEach((c,i)=>g.addColorStop(i/(stops.length-1),c));return g}
}}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);const f=v=>Math.max(0,Math.min(255,v+amt));return `rgb(${f(n>>16)},${f((n>>8)&255)},${f(n&255)})`}
function srand(s){let h=0;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))|0;h=Math.abs(h)||1;return()=>{h=(h*16807)%2147483647;return(h-1)/2147483646}}
const talk=t=>Math.max(0,Math.sin(t*11)*Math.sin(t*2.7+1));
const blink=t=>(t%3.4)<.13;

/* ---------- a person, bust shot ---------- */
function mixC(a,b,k){const p=v=>[parseInt(v.slice(1,3),16),parseInt(v.slice(3,5),16),parseInt(v.slice(5,7),16)];const A=p(a),B=p(b);return"#"+A.map((v,i)=>Math.round(v+(B[i]-v)*k).toString(16).padStart(2,"0")).join("")}
function person(x,cx,cy,s,L,o){
  o=o||{};const g=G(x),hc=L.hair,sk=L.skin;
  const skD=shade(sk,-30),skDD=shade(sk,-60),skL=shade(sk,22),hcL=shade(hc,55),hcD=shade(hc,-30);
  const X=v=>cx+v*s,Y=v=>cy+v*s;
  const path=pts=>{x.beginPath();x.moveTo(X(pts[0]),Y(pts[1]));for(let i=2;i<pts.length;i+=6)x.bezierCurveTo(X(pts[i]),Y(pts[i+1]),X(pts[i+2]),Y(pts[i+3]),X(pts[i+4]),Y(pts[i+5]));x.closePath()};
  const rg=(x0,y0,r0,r1,stops)=>{const gr=x.createRadialGradient(X(x0),Y(y0),r0*s,X(x0),Y(y0),r1*s);stops.forEach((c,i)=>gr.addColorStop(i/(stops.length-1),c));return gr};
  const lg=(x0,y0,x1,y1,stops)=>{const gr=x.createLinearGradient(X(x0),Y(y0),X(x1),Y(y1));stops.forEach((c,i)=>gr.addColorStop(i/(stops.length-1),c));return gr};
  const hairFill=lg(0,-55,0,40,[hcL,hc,hcD]);
  /* back hair */
  if(L.style==="long"){path([-30,-34, -46,-10,-46,40,-44,86, -20,92,20,92,44,86, 46,40,46,-10,30,-34, 14,-50,-14,-50,-30,-34]);x.fillStyle=lg(0,-50,0,90,[hc,hcD]);x.fill()}
  if(L.style==="afro"){x.beginPath();x.ellipse(X(0),Y(-18),58*s,54*s,0,0,TAU);x.fillStyle=rg(-14,-36,6,64,[hcL,hc,hcD]);x.fill()}
  if(L.style==="puffs"){[-1,1].forEach(d=>{x.beginPath();x.arc(X(d*36),Y(-36),21*s,0,TAU);x.fillStyle=rg(d*30,-44,3,24,[hcL,hc,hcD]);x.fill()})}
  if(L.style==="curly"){x.beginPath();x.ellipse(X(0),Y(-12),40*s,42*s,0,0,TAU);x.fillStyle=hcD;x.fill()}
  /* neck */
  x.fillStyle=lg(0,10,0,62,[skDD,skD,sk]);x.fillRect(X(-11),Y(8),22*s,56*s);
  /* torso */
  path([-15,44, -40,47,-68,52,-82,72, -90,140,-96,240,-98,330, -30,330,30,330,98,330, 96,240,90,140,82,72, 68,52,40,47,15,44, 9,57,-9,57,-15,44]);
  x.fillStyle=lg(-95,0,95,0,[shade(L.shirt,-28),L.shirt,shade(L.shirt,10),shade(L.shirt,-32)]);x.fill();
  x.fillStyle=lg(0,44,0,200,["rgba(255,255,255,.08)","rgba(0,0,0,.18)"]);x.fill();
  x.beginPath();x.moveTo(X(-15),Y(44));x.bezierCurveTo(X(-9),Y(57),X(9),Y(57),X(15),Y(44));x.strokeStyle=shade(L.shirt,-35);x.lineWidth=3.2*s;x.stroke();
  x.globalAlpha=.35;x.strokeStyle=shade(L.shirt,-45);x.lineWidth=2*s;[[-1],[1]].forEach(([d])=>{x.beginPath();x.moveTo(X(d*70),Y(64));x.quadraticCurveTo(X(d*76),Y(110),X(d*72),Y(160));x.stroke();x.beginPath();x.moveTo(X(d*48),Y(120));x.quadraticCurveTo(X(d*40),Y(140),X(d*46),Y(170));x.stroke()});x.globalAlpha=1;
  if(o.guitar)guitar(x,cx+6*s,cy+100*s,s,sk,o.strum||0);
  /* jaw shadow on neck */
  x.beginPath();x.ellipse(X(0),Y(30),17*s,9*s,0,0,TAU);x.fillStyle="rgba(0,0,0,.18)";x.fill();
  /* ears */
  [-1,1].forEach(d=>{x.beginPath();x.ellipse(X(d*26.5),Y(-3),5.5*s,9.5*s,d*.15,0,TAU);x.fillStyle=skD;x.fill();x.beginPath();x.ellipse(X(d*26),Y(-3),3*s,6*s,d*.15,0,TAU);x.fillStyle=sk;x.fill()});
  /* face */
  const face=[0,-44, 17,-44,27,-31,27,-12, 27,6,24,20,14,30, 8,36,4,38,0,38, -4,38,-8,36,-14,30, -24,20,-27,6,-27,-12, -27,-31,-17,-44,0,-44];
  path(face);x.fillStyle=rg(-7,-12,4,52,[skL,sk,sk,skD]);x.fill();
  x.save();path(face);x.clip();
  x.fillStyle=lg(0,10,0,40,["rgba(0,0,0,0)","rgba(0,0,0,.10)"]);x.fillRect(X(-30),Y(10),60*s,30*s);
  [-1,1].forEach(d=>{x.fillStyle=rg(d*15,10,1,10,["rgba(235,110,110,.28)","rgba(235,110,110,0)"]);x.fillRect(X(d*15-11),Y(-1),22*s,22*s)});
  x.restore();
  /* front hair */
  x.fillStyle=hairFill;
  const strands=(pts)=>{x.save();x.globalAlpha=.35;x.strokeStyle=hcL;x.lineWidth=1.2*s;pts.forEach(p=>{x.beginPath();x.moveTo(X(p[0]),Y(p[1]));x.quadraticCurveTo(X(p[2]),Y(p[3]),X(p[4]),Y(p[5]));x.stroke()});x.restore()};
  switch(L.style){
    case"short":path([-28,-6, -31,-40,-12,-54,6,-52, 24,-51,33,-36,29,-8, 27,-20,22,-31,10,-33, -2,-28,-16,-33,-23,-22, -25,-16,-27,-12,-28,-6]);x.fill();strands([[-18,-44,-4,-50,12,-46],[-22,-36,-6,-44,14,-40],[0,-48,16,-44,24,-34]]);break;
    case"long":path([-29,-8, -32,-42,-14,-54,0,-50, 14,-54,32,-42,29,-8, 30,20,32,50,36,66, 28,70,24,40,22,10, 22,-14,14,-32,0,-36, -14,-32,-22,-14,-22,10, -24,40,-28,70,-36,66, -32,50,-30,20,-29,-8]);x.fill();strands([[-4,-46,-18,-40,-24,-16],[4,-46,18,-40,24,-16],[-26,0,-28,30,-32,60],[26,0,28,30,32,60]]);break;
    case"bun":path([-28,-8, -31,-42,-14,-50,0,-49, 14,-50,31,-42,28,-8, 24,-24,14,-34,0,-35, -14,-34,-24,-24,-28,-8]);x.fill();x.beginPath();x.arc(X(0),Y(-52),14*s,0,TAU);x.fillStyle=rg(-4,-57,2,16,[hcL,hc,hcD]);x.fill();x.fillStyle=L.shirt;x.fillRect(X(-8),Y(-41),16*s,4*s);strands([[-20,-40,-8,-46,0,-46],[20,-40,8,-46,0,-46]]);break;

    S.nseen=Date.now();save();setTimeout(updateDot,0)}
  else{const has=USERS.filter(u=>S.chats[u.h]&&S.chats[u.h].msgs.length).sort((a,b)=>S.chats[b.h].msgs.at(-1).time-S.chats[a.h].msgs.at(-1).time);const rest=USERS.filter(u=>!has.includes(u));
    body=has.map(u=>{const c=S.chats[u.h],m=c.msgs.at(-1);return`<button type="button" class="irow ${c.unread?"unread":""}" data-chat-open="${esc(u.h)}">${av(u,"sm")}<span class="t"><div class="l1"><b>${esc(u.n)}</b>${vf(u)}</div><div class="l2">${m.from==="me"?"You: ":""}${esc(m.t)} · ${ago(m.time)}</div></span>${c.unread?`<span class="udot"></span>`:""}</button>`}).join("")
     +(rest.length?`<h3 class="sec">Start a chat</h3><div class="stories">${rest.map(u=>`<button type="button" class="story" data-chat-open="${esc(u.h)}"><span class="ringwrap" style="background:var(--line)"><img class="av" src="${avURL(u)}" alt=""></span><span class="n">${esc(u.h)}</span></button>`).join("")}</div>`:"")}
  view.innerHTML=`<section class="wrap"><h2>Inbox</h2><div class="seg"><button type="button" data-seg="activity" aria-pressed="${seg==="activity"}">Activity</button><button type="button" data-seg="messages" aria-pressed="${seg==="messages"}">Messages${unreadChats?` (${unreadChats})`:""}</button></div><div class="ilist">${body}</div></section>`;
}
function simulate(pid){const fans=USERS.slice().sort(()=>Math.random()-.5).slice(0,4);
  [[1800,"like"],[4500,"comment"],[7500,"like"],[11000,"follow"]].forEach(([ms,type],i)=>setTimeout(()=>{const p=S.mine.find(x=>x.id===pid);if(!p)return;const u=fans[i];let text;
    if(type==="like"){p.likes++;text="liked your post"}
    else if(type==="comment"){const c=cmtFor(p);p.comments.push({u:u.h,t:c});text="commented: "+c;
      const box=document.querySelector(`.post[data-id="${pid}"] .comments`);if(box){box.hidden=false;box.querySelector("form").insertAdjacentHTML("beforebegin",`<p>${av(u,"xs")}<span><b>@${esc(u.h)}</b> ${esc(c)}</span></p>`)}}
    else{S.fans++;text="started following you"}
    S.notifs.unshift({u:u.h,text,time:Date.now(),pid:type==="follow"?null:pid});save();
    document.querySelectorAll(`[data-like="${pid}"] span:last-child`).forEach(s=>s.textContent=fmt(p.likes+(S.liked[pid]?1:0)));
    document.querySelectorAll(`[data-cm="${pid}"] span:last-child`).forEach(s=>s.textContent=p.comments.length+(S.extra[pid]||[]).length);
    updateDot();toast(`${u.h} ${text}`)},ms))}
function openStory(start){const list=USERS.map(u=>({u,p:seeded.find(q=>q.user===u.h&&q.scene)||seeded.find(q=>q.scene)}));let i=start,el=0,last=performance.now(),paused=false;
  const ov=document.createElement("div");ov.className="storyv";ov.innerHTML=`<div class="in"><div class="pic"></div><div class="bars">${list.map(()=>"<span><i></i></span>").join("")}</div><div class="top"></div><button type="button" class="tapL" aria-label="Previous story"></button><button type="button" class="tapR" aria-label="Next story"></button><div class="cap"></div><form><input id="storyReply" maxlength="200" placeholder="Send message" aria-label="Reply to story" autocomplete="off"><button class="btn sm" type="submit">Send</button></form></div>`;
  document.body.appendChild(ov);
  const close=()=>{ov.remove();document.removeEventListener("keydown",k);if(S.tab==="feed")renderFeed()};
  const k=e=>{if(e.target.id==="storyReply")return;if(e.key==="Escape")close();if(e.key==="ArrowRight")show(i+1);if(e.key==="ArrowLeft")show(i-1)};document.addEventListener("keydown",k);
  function show(n){if(n<0)n=0;if(n>=list.length)return close();i=n;el=0;const {u,p}=list[i];S.seenStories[u.h]=1;
    ov.querySelector(".pic").style.backgroundImage=`url(${sceneURL(p)})`;
    ov.querySelector(".top").innerHTML=`${av(u,"xs")}<span>${esc(u.h)}${vf(u)}</span><span style="opacity:.75;font-weight:600">${ago(p.time)}</span><button type="button" class="x" aria-label="Close">×</button>`;
    ov.querySelector(".cap").textContent=p.caps?p.caps[0]:p.text;ov.querySelector("#storyReply").placeholder=`Reply to ${u.h}…`;
    ov.querySelectorAll(".bars i").forEach((b,j)=>b.style.width=j<i?"100%":"0")}
  const tick=now=>{if(!ov.isConnected)return;const dt=now-last;last=now;if(!paused)el+=dt;const f=Math.min(1,el/5000);ov.querySelectorAll(".bars i")[i].style.width=f*100+"%";if(f>=1)show(i+1);requestAnimationFrame(tick)};
  ov.addEventListener("click",e=>{if(e.target.closest(".x"))return close();if(e.target.closest(".tapR"))show(i+1);if(e.target.closest(".tapL"))show(i-1)});
  const inp=ov.querySelector("#storyReply");inp.onfocus=()=>paused=true;inp.onblur=()=>paused=false;
  ov.querySelector("form").onsubmit=e=>{e.preventDefault();const v=inp.value.trim();if(!v)return;const h=list[i].u.h;const c=S.chats[h]||(S.chats[h]={msgs:[],unread:false});c.msgs.push({from:"me",t:"Replied to your story: "+v,time:Date.now()});save();inp.value="";inp.blur();toast("Sent");scheduleReply(h)};
  show(start);requestAnimationFrame(tick)}

/* ---------- cart ---------- */
function renderCart(){
  const lines=Object.entries(S.cart).map(([id,q])=>({p:P(+id),q}));
  const sub=lines.reduce((a,l)=>a+l.p.price*l.q,0),ship=sub>0&&sub<35?4.99:0,tax=sub*.07,total=sub+ship+tax;
  view.innerHTML=`<section class="wrap"><h2>Your cart</h2><p class="sub">You pay with Loop Coins.</p>
   ${lines.length?`<div class="cartlist">${lines.map(({p,q})=>`<div class="line"><img src="${pimg(p)}" alt=""><div class="t"><div>${esc(p.name)}</div><div style="color:var(--muted);font-size:13px">${money(p.price)} each</div></div>
     <span class="qty"><button type="button" data-cq="${p.id}" data-d="-1" aria-label="Fewer">−</button><span>${q}</span><button type="button" data-cq="${p.id}" data-d="1" aria-label="More">+</button></span><span class="money">${money(p.price*q)}</span></div>`).join("")}</div>
   <div class="totals"><div class="r"><span>Subtotal</span><span>${money(sub)}</span></div><div class="r"><span>Shipping${ship?" (free over $35)":""}</span><span>${ship?money(ship):"Free"}</span></div><div class="r"><span>Tax (7%)</span><span>${money(tax)}</span></div><div class="r big"><span>Total</span><span>${money(total)}</span></div>
   <div class="r" style="color:var(--muted);font-size:13px"><span>Loop Coins after</span><span>${(S.coins-total).toFixed(2)}</span></div>
   <button type="button" class="btn" id="checkout" ${S.coins<total?"disabled":""}>${S.coins<total?"Not enough Loop Coins":"Place order"}</button></div>`
   :`<p class="empty">Your cart is empty.<br><br><button type="button" class="btn" data-go="shop">Browse 100 items</button></p>`}</section>`;
  const co=$("#checkout");if(co)co.onclick=()=>{S.coins=+(S.coins-total).toFixed(2);S.orders.unshift({n:1000+S.orders.length+1,items:cartCount(),total,time:Date.now()});S.notifs.unshift({u:null,text:`Your order #${S.orders[0].n} is on its way`,time:Date.now()+1});updateDot();S.cart={};save();updateCartCount();toast("Order placed! It's on its way.");go("me")};
}

/* ---------- me ---------- */
const SKIN=["#f3d2b3","#e8b98f","#d9a07a","#c68a5e","#a8714b","#6b4430","#4a2d1c"];
const HAIR=["#151515","#3b2314","#8b4a1f","#c88b4a","#e8c27a","#b0b0b8","#ff7aa2","#4361ee"];
const SHIRT=["#2f4bff","#e4572e","#1a9b63","#ff8fab","#7b2cbf","#f4a261","#264653","#e9c46a"];
const BGS=["#cfd8ff","#ffd9c7","#c9f2dd","#ffe0ea","#e5d4ff","#fff1c4"];
const STYLES=[["short","Short"],["long","Long"],["curly","Curly"],["bun","Bun"],["buzz","Buzz"],["afro","Afro"],["puffs","Puffs"]];
function renderMe(){
  const L=S.me.look;const sw=(key,arr)=>`<div class="swatches">${arr.map(c=>`<button type="button" class="sw" data-look="${key}" data-val="${c}" aria-label="${key} ${c}" aria-pressed="${L[key]===c&&!(key!=="bg"&&false)}" style="background:${c}"></button>`).join("")}</div>`;
  const editorHTML=S.editing?`<div class="editor" style="margin:0">
     <div class="lbl">Profile picture</div>
     <div class="tools"><label class="chip" for="pfile">Upload a photo<input id="pfile" type="file" accept="image/*" hidden></label>${S.me.photo?`<button type="button" class="chip" id="rmp">Use drawn avatar</button>`:""}</div>
     ${S.me.photo?"":`<div class="lbl">Skin</div>${sw("skin",SKIN)}
     <div class="lbl">Hair</div><div class="swatches">${STYLES.map(([k,l])=>`<button type="button" class="chip" data-look="style" data-val="${k}" aria-pressed="${L.style===k}">${l}</button>`).join("")}</div>${sw("hair",HAIR)}
     <div class="lbl">Shirt</div>${sw("shirt",SHIRT)}
     <div class="lbl">Background</div>${sw("bg",BGS)}
     <div><button type="button" class="chip" data-look="glasses" data-val="toggle" aria-pressed="${!!L.glasses}">Glasses</button></div>`}
   </div>
   <form id="prof" class="editor">
     <label class="field" for="pn">Display name<input id="pn" maxlength="24" value="${esc(S.me.n)}"></label>
     <label class="field" for="ph">Username<input id="ph" maxlength="20" value="${esc(S.me.h)}"></label>
     <label class="field" for="pb">Bio<input id="pb" maxlength="80" value="${esc(S.me.bio||"")}"></label>
     <div class="tools"><button class="btn" type="submit">Save profile</button><button class="btn ghost" type="button" id="topup">Get 200 coins</button></div>
   </form>`:"";
  view.innerHTML=`<section class="wrap">${profileHTML(S.me,S.mine,true,S.meTab,editorHTML)}
   <h3 class="sec">Wallet</h3>
   <div class="stats"><div><b class="coins">${S.coins.toFixed(0)}</b>Loop Coins</div><div><b>${S.orders.length}</b>orders</div></div>
   <h3 class="sec">Orders</h3>
   <div class="orders">${S.orders.length?S.orders.map(o=>`<div class="order"><span>Order #${o.n} · ${o.items} item${o.items===1?"":"s"}</span><span>${money(o.total)}</span><span class="status">Shipped</span></div>`).join(""):`<p class="sub">No orders yet.</p>`}</div>
   <button type="button" class="btn ghost" id="reset" style="margin-top:20px">Reset everything</button></section>`;
  view.querySelectorAll(".media.video").forEach(mountVideo);
  $("#editp").onclick=()=>{S.editing=!S.editing;renderMe()};
  $("#sharep").onclick=()=>{const t="loopmarket.app/@"+S.me.h;try{navigator.clipboard.writeText(t).then(()=>toast("Profile link copied"),()=>toast("Profile link: "+t))}catch(_){toast("Profile link: "+t)}};
  view.querySelectorAll("[data-look]").forEach(b=>b.onclick=()=>{const k=b.dataset.look;S.me.look[k]=k==="glasses"?!S.me.look.glasses:b.dataset.val;save();renderMe()});
  if(S.editing){$("#pfile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>shrink(r.result,200,img=>{S.me.photo=img;save();toast("Profile picture updated");renderMe()});r.readAsDataURL(f)};
  const rmp=$("#rmp");if(rmp)rmp.onclick=()=>{S.me.photo=null;save();renderMe()};
  $("#prof").onsubmit=e=>{e.preventDefault();const old=S.me.h;S.me.n=$("#pn").value.trim()||"You";S.me.bio=$("#pb").value.trim();let nh=($("#ph").value.trim().replace(/[^\w.]/g,"")||"you").toLowerCase();if(U(nh))nh+="_";S.me.h=nh;
    S.mine.forEach(p=>{if(p.user===old)p.user=nh});Object.values(S.extra).forEach(a=>a.forEach(c=>{if(c.u===old)c.u=nh}));save();S.editing=false;toast("Profile saved");renderMe()};
  $("#topup").onclick=()=>{S.coins+=200;save();toast("+200 Loop Coins");renderMe()};}
  const r=$("#reset");r.onclick=()=>{if(r.dataset.sure){Object.assign(S,{mine:[],liked:{},follow:{},extra:{},cart:{},orders:[],coins:500,me:JSON.parse(JSON.stringify(DEFAULT_ME)),chats:seedChats(),notifs:[],fans:0,nseen:0,editing:false});save();updateCartCount();toast("Reset done");renderMe()}else{r.dataset.sure=1;r.textContent="Tap again to erase your posts, cart, orders and profile"}};
}

/* ---------- shared click handling ---------- */
const view=$("#view");
function feedClicks(e){
  const t=e.target;
  const sn=t.closest("[data-snd]");if(sn){AUD.setMuted(!S.muted);return true}
  const rl=t.closest(".reel");if(rl&&!t.closest("button,form,input")){tapMedia(rl,()=>{if(playing.has(rl.dataset.pid)){stopReel(rl);rl.querySelector(".paused").hidden=false}else playReel(rl)});return true}
  const md=t.closest(".media");if(md){tapMedia(md,()=>{if(md.classList.contains("video"))toggleVideo(md)});return true}
  const like=t.closest("[data-like]");if(like){setLike(like.dataset.like,!S.liked[like.dataset.like]);return true}
  const fb=t.closest("[data-follow]");if(fb){setFollow(fb.dataset.follow,!S.follow[fb.dataset.follow]);return true}
  const cm=t.closest("[data-cm]");if(cm){const post=cm.closest(".post");if(!post){openComments(cm.dataset.cm);return true}const box=post.querySelector(".comments");box.hidden=!box.hidden;box.hidden?openCm.delete(cm.dataset.cm):openCm.add(cm.dataset.cm);if(!box.hidden)box.querySelector("input").focus();return true}
  const sh=t.closest("[data-share]");if(sh){const p=allPosts().find(x=>x.id===sh.dataset.share);try{navigator.clipboard.writeText(p.text||"Check this out on Loop Market").then(()=>toast("Post text copied"),()=>toast("Shared!"))}catch(_){toast("Shared!")}return true}
  const pr=t.closest("[data-prod]");if(pr){openProduct(+pr.dataset.prod);return true}
  return false;
}
function commentSubmit(e){const f=e.target.closest("[data-cform]");if(!f)return;e.preventDefault();const id=f.dataset.cform,inp=f.querySelector("input"),v=inp.value.trim();if(!v)return;
  (S.extra[id]=S.extra[id]||[]).push({u:S.me.h,t:v});save();openCm.add(id);const p=document.createElement("p");p.innerHTML=`${av(S.me,"xs")}<span><b>@${esc(S.me.h)}</b> ${esc(v)}</span>`;f.before(p);inp.value="";
  document.querySelectorAll(`[data-cm="${id}"] span:last-child`).forEach(c=>c.textContent=+c.textContent+1);
  const post=allPosts().find(x=>x.id===id);
  if(post&&post.user!==S.me.h&&U(post.user))setTimeout(()=>{const rep=commentReply(post,v),cu=U(post.user);(S.extra[id]=S.extra[id]||[]).push({u:cu.h,t:rep});save();
    document.querySelectorAll(`[data-cform="${id}"]`).forEach(f2=>{const pe=document.createElement("p");pe.innerHTML=`${av(cu,"xs")}<span><b>@${esc(cu.h)}</b> ${esc(rep)}</span>`;f2.before(pe)});
    document.querySelectorAll(`[data-cm="${id}"] span:last-child`).forEach(c=>c.textContent=+c.textContent+1);toast(`${cu.h} replied to your comment`)},2500+Math.random()*2000)}
view.addEventListener("click",e=>{
  if(feedClicks(e))return;const t=e.target;
  const st=t.closest("[data-story]");if(st){if(st.dataset.story==="me"){const c=$("#ctext");if(c){c.focus();c.scrollIntoView({block:"center"})}}else openStory(+st.dataset.story);return}
  const su=t.closest("[data-story-user]");if(su){openStory(USERS.findIndex(x=>x.h===su.dataset.storyUser));return}
  if(t.closest("[data-compose]")){go("feed");setTimeout(()=>{const c=$("#ctext");if(c)c.focus()},30);return}
  const sg=t.closest("[data-seg]");if(sg){S.inboxSeg=sg.dataset.seg;renderInbox();return}
  const co=t.closest("[data-chat-open]");if(co){openChat(co.dataset.chatOpen);return}
  const nr=t.closest("[data-n-post]");if(nr){if(nr.dataset.nPost)openPost(nr.dataset.nPost);else if(nr.dataset.nUser)openUser(nr.dataset.nUser);return}
  const op=t.closest("[data-open-post]");if(op){openPost(op.dataset.openPost);return}
  const pt=t.closest("[data-ptab]");if(pt){S.meTab=pt.dataset.ptab;renderMe();return}
  const us=t.closest("[data-user]");if(us){openUser(us.dataset.user);return}
  const tp=t.closest("[data-topic]");if(tp){S.topic=tp.dataset.topic;stopAll();renderFeed();return}
  const del=t.closest("[data-del]");if(del){S.mine=S.mine.filter(p=>p.id!==del.dataset.del);save();toast("Post deleted");S.tab==="me"?renderMe():renderFeed();return}
  const ct=t.closest("[data-cat]");if(ct){S.cat=ct.dataset.cat;renderShop();return}
  const cq=t.closest("[data-cq]");if(cq){const id=cq.dataset.cq;S.cart[id]=(S.cart[id]||0)+ +cq.dataset.d;if(S.cart[id]<=0)delete S.cart[id];save();updateCartCount();renderCart();return}
  const g=t.closest("[data-go]");if(g)go(g.dataset.go);
});
view.addEventListener("submit",commentSubmit);

function go(tab){stopAll();if(reelObs){reelObs.disconnect();reelObs=null}if(feedObs){feedObs.disconnect();feedObs=null}S.tab=tab;document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));
  ({feed:renderFeed,reels:renderReels,shop:renderShop,cart:renderCart,inbox:renderInbox,me:renderMe})[tab]();window.scrollTo({top:0})}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>go(b.dataset.tab));
$("#topCart").onclick=()=>go("cart");
updateCartCount();
const hh=(location.hash||"").slice(1);go(["feed","reels","shop","cart","inbox","me"].includes(hh)?hh:"feed");updateDot();
})();
</script>
<script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
